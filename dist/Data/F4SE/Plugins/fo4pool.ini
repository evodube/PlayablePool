; fo4pool settings. Re-read every time you rack or calibrate, so you can edit this with the game running.

[Keys]
; Windows virtual-key codes. 0 = off.
iRack=0x67        ; Numpad 7: rack the balls on the table you're looking at (or the one clicked in the console)
iShoot=0x68       ; Numpad 8: start/stop aiming (shot camera). In aim mode: hold left mouse and pull back for power,
                  ; release to shoot; right mouse toggles the overhead view. Weapons and movement are off while aiming
iClear=0x69       ; Numpad 9: take all the balls away
iCalibrate=0x64   ; Numpad 4: show/hide markers on the felt corners, side pockets, spots and centre
iCallPocket=0x65   ; Numpad 5: when you're on the 8, pick the pocket you're calling (marked on the table)
iChallenge=0x66   ; Numpad 6: look at a settler or companion and press it to play them at 8-ball. Again: they stop

[Ball]
; The objects spawned as balls: statics (no Havok). fo4pool.esl has the cue ball at 0x800 and ball n at 0x800 + n.
sPlugin=fo4pool.esl
iCueFormID=0x800
iFormID=0         ; nonzero: use this one object for every numbered ball
; iFormID1=0x801  ; ...or override single balls (iFormID1 to iFormID15)
fRadius=3.51      ; ball radius in game units (the vanilla pool ball meshes)
bAutoScale=1      ; scale the mesh so it's fRadius big. 0 = use fScale instead
fScale=1.0
fZOffset=0.0      ; raise or lower the balls if the mesh's centre isn't the ball's centre

[Shot]
; Hold the left mouse button (the camera freezes), pull the mouse back for power, push forward for less, release to
; shoot. Releasing at 0% cancels.
fMinSpeed=28      ; cue ball speed at the lowest power, units per second
fMaxSpeed=365     ; at 100% (a hard break). Was 980 up to 0.3.2, when 50% gave this speed
fPullPerDegree=0.04 ; power per degree the mouse tries to tilt the view: 0.04 = full power after a 25 degree pull
bInvertPull=0     ; 1 = push the mouse forward for power

[Camera]
; The shot camera orbits the cue ball; the mouse turns it, and you shoot the way it faces.
fDistance=75      ; from the cue ball
fPitch=20         ; degrees below horizontal when aiming starts
fMinPitch=4
fMaxPitch=80
fOverheadHeight=240

[Guide]
; Dots showing where the cue ball goes, where it meets the first ball, and where both go next.
bEnabled=1
fDotRadius=0.45
fSpacing=5
fMaxLength=400    ; how far ahead of the cue ball the path is shown
fObjectLength=45  ; the hit ball's path
fCueLength=25     ; the cue ball's path after the hit

[Stick]
; The cue stick drawn behind the cue ball: a static made from the vanilla Pool Cue mesh. iFormID=0 turns it off.
sPlugin=fo4pool.esl
iFormID=0x810
iAxis=1           ; mesh axis the stick runs along: 0 = X, 1 = Y, 2 = Z
fTip=83           ; tip's coordinate on that axis
fButt=-11         ; butt's coordinate on that axis
fElevation=6      ; degrees the butt is raised
fMaxPull=18       ; how far it draws back at full power
fGap=1.5          ; gap between the tip and the cue ball

[Opponent]
; Rack a table, look at a settler or companion and press the challenge key: they play you at 8-ball. They walk to
; each shot, line it up and strike. They're Player 2.
fSkill=0.6        ; 0 = hopeless, 1 = never misses its aim
fAimSeconds=2.5   ; how long they line the shot up before striking
bRun=0            ; 1 = run to the shot instead of walking
fWalkTimeout=20   ; seconds to reach the shot before they're put there
fPickDistance=600 ; how far away the NPC you challenge can be
bLog=1            ; a status line about them in fo4pool.log every second (where they are, their AI package, ...)

[Anim]
; The opponent's pool idles in fo4pool.esl (dynamic idles pointing at Meshes\Actors\Character\Animations\fo4pool).
bEnabled=1
sPlugin=fo4pool.esl
iAimFormID=0x811
iStrikeFormID=0x812
iWaitFormID=0x813 ; standing at the table with the cue between shots

[HUD]
; The terminal HUD (scoreboard, turn, cue power, fouls). Needs F4SE Menu Framework. It sizes itself to the screen
; height (the same share of the screen at 1080p, 1440p or 4K); fScale makes it bigger or smaller on top of that.
fScale=1.0          ; 0.75 = smaller, 1.25 = bigger (0.3 to 3). Also in the F4SE Menu Framework menu: fo4pool > HUD
bNotifications=0    ; 1 = also show every call ("3 in", "Player 2's shot") as the game's corner messages. Without the
                    ; HUD (no Menu Framework) they're always shown. Problems ("look at a pool table") always show

[Rules]
; 8-ball. Solids 1-7, stripes 9-15; the first ball potted after the break decides who is which. A foul (scratch,
; hitting nothing, hitting the wrong ball first, no cushion after the contact) gives the other player ball in hand.
iGameMode=0         ; 0 = 8-Ball (two players), 1 = Solo Play: pot all 14, then the 8 into the called pocket.
                    ; Solo Play is lost by the 8 on the break, the 8 too early, the 8 in another pocket, or a
                    ; scratch while on the 8. Other scratches just give ball in hand.
bCallEight=1        ; 1 = the 8 must go in the called pocket. It's picked from your aim; Numpad 5 changes it
fPlaceSpeed=0.06    ; ball in hand: how far the cue ball moves per bit of mouse movement

[Sound]
; Data\Sound\fo4pool\*.wav (CC0, "Pool and Billiards" by Suraj Kispotta). Each hit is as loud as it was hard.
bEnabled=1
fVolume=0.8         ; 0 to 1
fFullDistance=150   ; full volume within this distance of the camera
fMaxDistance=3000   ; silent beyond this
bBallReturn=1       ; 1 = a pocketed ball is heard rolling away under the table
iBallReturnEnd=1    ; where it rolls to: 1 = the foot end (where the balls are racked), -1 = the head end.
                    ; Pockets nearer that end give a shorter roll.

[Table]
bUseConsolePick=1 ; 1 = the object clicked in the console is used before the one under the crosshair
fAimDistance=400
; Where the felt is, in the table mesh's own space. Measured from the vanilla PoolTable01.nif; use the calibration
; markers (Numpad 4) to check them, or to fit another table.
iLengthAxis=1     ; 0 = the table's long side runs along the mesh's X axis, 1 = along Y
fLength=224       ; playing surface, cushion nose to cushion nose
fWidth=112
fSurfaceZ=70.4    ; height of the felt above the mesh origin
fOffsetX=0        ; centre of the felt relative to the mesh origin
fOffsetY=0
fCornerMouth=12.4 ; corner pocket opening (bigger = easier)
fSideMouth=17     ; side pocket opening (20.8 up to 0.3.2)
; How picky the pockets are. A ball drops once its centre is fPocketDepth ball radii past the opening; on the
; way it can hit the jaws (the angled walls inside each opening) and rattle back out.
fPocketDepth=0.7    ; 0 = drops as soon as it crosses the cushion line (the old, easy pockets)
fJawLength=1.3      ; how far the jaws reach into the pocket, in ball radii (0 = no jaws)
fCornerJawAngle=15  ; degrees the corner jaws close in; more = pickier corners
fSideJawAngle=0     ; the same for the side pockets

[Physics]
fRollDecel=17.5         ; how quickly rolling balls slow down (units/s per second)
fBallRestitution=0.75   ; how much of the cue ball's speed a hit ball gets: 0.75 = 87%, 1.0 = all of it
fCushionRestitution=0.75
