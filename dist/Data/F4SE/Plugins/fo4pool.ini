; fo4pool test build settings. Re-read every time you rack or calibrate, so you can edit this with the game running.

[Keys]
; Windows virtual-key codes. 0 = off.
iRack=0x67        ; Numpad 7: rack the balls on the table you're looking at (or the one clicked in the console)
iShoot=0x68       ; Numpad 8: hit the cue ball the way you're facing. Hold Shift = soft, Ctrl = hard
iClear=0x69       ; Numpad 9: take all the balls away
iCalibrate=0x64   ; Numpad 4: show/hide markers on the felt corners, side pockets, spots and centre

[Ball]
; The objects spawned as balls: statics (no Havok). fo4pool.esl has the cue ball at 0x800 and ball n at 0x800 + n.
sPlugin=fo4pool.esl
iCueFormID=0x800
iFormID=0         ; nonzero: use this one object for every numbered ball
; iFormID1=0x801  ; ...or override single balls (iFormID1 to iFormID15)
fRadius=3.51      ; ball radius in game units (the vanilla pool ball meshes)
bAutoScale=1      ; scale the mesh so it's fRadius big. 0 = use fScale instead
fScale=1.0
fZOffset=0.0      ; raise or lower the balls if the mesh's centre isn't the ball's centre

[Shot]
fSpeed=880        ; cue ball speed in units per second

[Table]
bUseConsolePick=1 ; 1 = the object clicked in the console is used before the one under the crosshair
fAimDistance=400
; Where the felt is, in the table mesh's own space. Measured from the vanilla PoolTable01.nif; use the calibration
; markers (Numpad 4) to check them, or to fit another table.
iLengthAxis=1     ; 0 = the table's long side runs along the mesh's X axis, 1 = along Y
fLength=224       ; playing surface, cushion nose to cushion nose
fWidth=112
fSurfaceZ=70.4    ; height of the felt above the mesh origin
fOffsetX=0        ; centre of the felt relative to the mesh origin
fOffsetY=0
fCornerMouth=12.4 ; corner pocket opening (bigger = easier)
fSideMouth=20.8   ; side pocket opening

[Physics]
fRollDecel=17.5         ; how quickly rolling balls slow down (units/s per second)
fBallRestitution=0.95   ; bounciness of ball-ball hits
fCushionRestitution=0.75
