; fo4pool settings. Re-read every time you rack or calibrate, so you can edit this with the game running.

[Keys]
; Windows virtual-key codes. 0 = off.
iRack=0x67        ; Numpad 7: rack the balls on the table you're looking at (or the one clicked in the console)
iShoot=0x68       ; Numpad 8: start/stop aiming (shot camera). In aim mode: hold left mouse and pull back for power,
                  ; release to shoot; right mouse toggles the overhead view. Weapons and movement are off while aiming
iClear=0x69       ; Numpad 9: take all the balls away
iTables=0x6F      ; Numpad /: turn Playable Pool off at every pool table (no prompts; F does the game's own thing, for
                  ; mods that use a pool table for something else), or back on. Saved as bActivateTable below
iStopAll=0x60     ; Numpad 0: force stop every game at every table (yours and the NPCs'; no results counted), and
                  ; everyone hanging round the tables goes back to what they were doing
iCalibrate=0x64   ; Numpad 4: show/hide markers on the felt corners, side pockets, spots and centre
iCallPocket=0x65   ; Numpad 5: when you're on the 8, pick the pocket you're calling (marked on the table)
iForfeit=0x58     ; X, twice: give up the game in play. Against an NPC they win; in Solo Play the game just ends
iChallenge=0x66   ; Numpad 6: look at a settler or companion and press it to play them at 8-ball. Again: they stop
bActivateTable=1  ; the game's activate key (F) while looking at a pool table. Tap: a Solo game, or with a game on, take
                  ; your shot. Hold: 2 player, a list of who's standing by the table (up/down arrows pick, F plays).
                  ; While aiming: F gets up from the table; on the 8, aim at a pocket 2 s to call it. The keys above still work
fActivateDistance=260 ; how close to the table that works
iPlay=0           ; off. A key here (0x47 = G): look at an NPC (settler or companion) by a pool table and press it to
                  ; play them at 8-ball (no prompt)
fPlayDistance=300 ; how close to them
fPlayNearTable=700 ; how close they have to be to a pool table (also who shows in the F list)

[Ball]
; The objects spawned as balls: statics (no Havok). fo4pool.esl has the cue ball at 0x800 and ball n at 0x800 + n.
sPlugin=fo4pool.esl
iCueFormID=0x800
iFormID=0         ; nonzero: use this one object for every numbered ball
; iFormID1=0x801  ; ...or override single balls (iFormID1 to iFormID15)
fRadius=3.51      ; ball radius in game units (the vanilla pool ball meshes)
bAutoScale=1      ; scale the mesh so it's fRadius big. 0 = use fScale instead
fScale=1.0
fZOffset=0.0      ; raise or lower the balls if the mesh's centre isn't the ball's centre
bGlowOwn=0        ; off. 1: your group's balls glow a little once groups are set (in hotseat: the shooter's). The 8 too when you're on it
fGlowStrength=0.6

[Shot]
; Hold the left mouse button (the camera freezes), pull the mouse back for power, push forward for less, release to
; shoot. Releasing at 0% cancels.
fMinSpeed=28      ; cue ball speed at the lowest power, units per second
fMaxSpeed=462     ; at 100% (a hard break). 401.5 + 15%; was 980 up to 0.3.2
fPullPerDegree=0.04 ; power per degree the mouse tries to tilt the view: 0.04 = full power after a 25 degree pull
bInvertPull=0     ; 1 = push the mouse forward for power

[Controller]
; Xbox-style controllers (anything XInput). The HUD shows controller buttons as soon as you touch the controller.
;   A: play / take your shot (hold for an opponent)   B: leave the table, close the list, cancel a kit
;   Right stick: aim   Y: overhead view   D-pad left/right: called pocket   Hold Back: forfeit
;   Ball in hand: left stick moves the cue ball, A sets it down
;   Game over: D-pad up racks again, D-pad down clears the table
;   Who-plays list: D-pad up/down picks, left/right 8-ball or 9-ball, A plays
bEnabled=1
; how you set power: 0 = hold RT and pull the right stick back (further = harder), let go of RT to shoot
;                    1 = squeeze RT (further = harder), let go of it or press A to shoot
iPowerMode=0
; how far the stick (or trigger) has to go for full power (1.0 = all the way)
fFullPull=0.9
; 1: push the right stick forward for power instead of pulling it back
bInvertPull=0
; ball in hand: how fast the left stick moves the cue ball
fPlaceSpeed=900
; a short rumble when the cue strikes
bRumble=1

[Camera]
; The shot camera orbits the cue ball; the mouse turns it, and you shoot the way it faces.
fDistance=75      ; from the cue ball
fPitch=20         ; degrees below horizontal when aiming starts
fMinPitch=4
fMaxPitch=80
fOverheadHeight=240

[Guide]
; Dots showing where the cue ball goes, where it meets the first ball, and where both go next.
bEnabled=1
fDotRadius=0.45
fSpacing=5
fMaxLength=400    ; how far ahead of the cue ball the path is shown
fObjectLength=45  ; the hit ball's path
fCueLength=25     ; the cue ball's path after the hit

[Stick]
; The cue stick drawn behind the cue ball: a static made from the vanilla Pool Cue mesh. iFormID=0 turns it off.
sPlugin=fo4pool.esl
iFormID=0x810
iAxis=1           ; mesh axis the stick runs along: 0 = X, 1 = Y, 2 = Z
fTip=83           ; tip's coordinate on that axis
fButt=-11         ; butt's coordinate on that axis
fElevation=6      ; degrees the butt is raised
fMaxPull=18       ; how far it draws back at full power
fGap=1.5          ; gap between the tip and the cue ball

[Opponent]
; Rack a table, look at a settler or companion and press the challenge key: they play you at 8-ball. They walk to
; each shot, line it up and strike. They're Player 2.
fSkill=0.6        ; 0 = hopeless, 1 = never misses its aim
fAimSeconds=2.5   ; how long they line the shot up before striking
bRun=0            ; 1 = run to the shot instead of walking
fWalkTimeout=15   ; a last resort: seconds of walking that isn't getting them there before they're put at the shot
                  ; (a walk that fails is sent again; they're only put there if it keeps failing this long)
fPickDistance=600 ; how far away the NPC you challenge can be
bLog=1            ; a status line about them in fo4pool.log every second (where they are, their AI package, ...)
fCarryTilt=50     ; the cue an NPC carries between shots: degrees up from level, tip forward (90 = straight up)
fCarryGrip=0.3    ; where the hand holds it, from the butt (0) to the tip (1)
fCarryIn=1.2      ; how far into the curled fingers it sits (more if it looks like it floats beside the hand)
fCarryOut=0.12    ; tip leaning out to the side, away from the body
bNpcGames=1       ; two settlers who've wandered over to a table now and then play each other at 8-ball. F at the
                  ; table to watch (the HUD comes up; walk about as you like), F again to stop. Wins and losses
                  ; count, for them and for you (shown in the hold-F list), and are kept in your save
iNpcGameChance=100 ; the chance (%) that two settlers at a table start a game (a miss: they think again a minute later)
fNpcGameDelay=3   ; how many seconds after the second one gets there. Up to 4 tables can have games going at once
fWatchDistance=85  ; watchers stand this far out from the edge of the felt (the rail is about 15 of it)
bBets=1           ; games against NPCs are played for caps, by their skill: BEGINNER 25, AMATEUR 50, SEMI-PRO 150,
                  ; PRO 300. You need the stake to play them; win it or lose it (a forfeit loses it). About a third
                  ; of them (picked at random, fixed per NPC) only ever play for fun
bOffers=1         ; a settler who's wandered over to the table asks you for a game now and then; F at that table
                  ; within fOfferWait seconds plays them
fOfferEvery=180   ; at most this often, in seconds
fOfferWait=30     ; how long they wait for an answer
bWander=1         ; settlers wander over to a pool table near you now and then and hang round it, so there's someone
                  ; to ask for a game (not companions, children, or anyone fighting)
fWanderEvery=45   ; about this often, in seconds
iWanderMax=3       ; at most this many at once
bReactions=1       ; people watching react now and then: clap or cheer a pot, cheer a win, laugh at a scratch, boo
                   ; or shake their head at a lost game (the game's own idles)
bReactionVoices=1  ; their cheers, boos and laughs are heard: the Combat Zone crowd's (no words), read from your own
                   ; game's voice files, a man's or a woman's to match who's reacting
fReactionChance=0.6  ; how often a pot gets a reaction (0 to 1); a win, two balls at once or a scratch get more
iWanderWorkers=1  ; settlers with a settlement job (farmer, guard, shop, scavenger...): 0 = never come over to the
                  ; table, 1 = only off duty (7 pm to 7 am game time; never those working round the clock), 2 = any time
fWanderStay=180   ; each hangs round about this long, in seconds
fWanderRange=2500 ; from this far from the table
bOwnPackage=1     ; 1 = they walk with fo4pool.esl's own AI package (a quest alias at priority 100, so it outranks the
                  ; sandbox packages other mods give settlers); always walks, bRun aside. 0 = Papyrus PathToReference

[Anim]
; The opponent's pool idles in fo4pool.esl (dynamic idles pointing at Meshes\Actors\Character\Animations\fo4pool).
bEnabled=1
sPlugin=fo4pool.esl
iAimFormID=0x811
iStrikeFormID=0x812
iWaitFormID=0x813 ; standing at the table with the cue between shots

[HUD]
; The terminal HUD (scoreboard, turn, cue power, fouls). Needs F4SE Menu Framework. It sizes itself to the screen
; height (the same share of the screen at 1080p, 1440p or 4K); fScale makes it bigger or smaller on top of that.
fScale=1.0          ; 0.75 = smaller, 1.25 = bigger (0.3 to 3). Also in the F4SE Menu Framework menu: fo4pool > HUD
bNotifications=0    ; 1 = also show every call ("3 in", "Player 2's shot") as the game's corner messages. Without the
                    ; HUD (no Menu Framework) they're always shown. Problems ("look at a pool table") always show

[Rules]
; 8-ball. Solids 1-7, stripes 9-15; the first ball potted after the break decides who is which. A foul (scratch,
; hitting nothing, hitting the wrong ball first, no cushion after the contact) gives the other player ball in hand.
iGameType=0         ; the game F starts: 0 = 8-ball, 1 = 9-ball. Looking at a table, left/right arrows switch it
                    ; (Solo and 2 player both). 9-ball: balls 1-9, always hit the lowest first, the 9 in on a legal shot
                    ; wins (the break and combinations too). NPC games are either, at random
iGameMode=1         ; 0 = 8-Ball (two players), 1 = Solo Play: pot all 14, then the 8 into the called pocket.
                    ; This is what you rack on your own; challenging an NPC is always 8-ball against them, and when
                    ; that game ends the next rack is this mode again.
                    ; Solo Play is lost by the 8 on the break, the 8 too early, the 8 in another pocket, or a
                    ; scratch while on the 8. Other scratches just give ball in hand.
bCallEight=1        ; 1 = the 8 must go in the called pocket. It's picked from your aim; Numpad 5 changes it
fPlaceSpeed=0.06    ; ball in hand: how far the cue ball moves per bit of mouse movement

[Sound]
; Data\Sound\fo4pool\*.wav (CC0, "Pool and Billiards" by Suraj Kispotta). Each hit is as loud as it was hard.
bEnabled=1
fVolume=0.8         ; 0 to 1
fFullDistance=150   ; full volume within this distance of the camera
fMaxDistance=700  ; silent beyond this (10 m), the rack and turn sounds too
bBallReturn=1       ; 1 = a pocketed ball is heard rolling away under the table
iBallReturnEnd=1    ; where it rolls to: 1 = the foot end (where the balls are racked), -1 = the head end.
                    ; Pockets nearer that end give a shorter roll.

[Table]
bUseConsolePick=1 ; 1 = the object clicked in the console is used before the one under the crosshair
fAimDistance=400
; Where the felt is, in the table mesh's own space. Measured from the vanilla PoolTable01.nif; use the calibration
; markers (Numpad 4) to check them, or to fit another table.
iLengthAxis=1     ; 0 = the table's long side runs along the mesh's X axis, 1 = along Y
fLength=224       ; playing surface, cushion nose to cushion nose
fWidth=112
fSurfaceZ=70.4    ; height of the felt above the mesh origin
fOffsetX=0        ; centre of the felt relative to the mesh origin
fOffsetY=0
fCornerMouth=12.4 ; corner pocket opening (bigger = easier)
fSideMouth=17     ; side pocket opening (20.8 up to 0.3.2)
; How picky the pockets are. A ball drops once its centre is fPocketDepth ball radii past the opening; on the
; way it can hit the jaws (the angled walls inside each opening) and rattle back out.
fPocketDepth=0.7    ; 0 = drops as soon as it crosses the cushion line (the old, easy pockets)
fJawLength=1.3      ; how far the jaws reach into the pocket, in ball radii (0 = no jaws)
fCornerJawAngle=15  ; degrees the corner jaws close in; more = pickier corners
fSideJawAngle=0     ; the same for the side pockets

[Physics]
fRollDecel=17.5         ; how quickly rolling balls slow down (units/s per second)
fBallRestitution=0.75   ; how much of the cue ball's speed a hit ball gets: 0.75 = 87%, 1.0 = all of it
fCushionRestitution=0.75
