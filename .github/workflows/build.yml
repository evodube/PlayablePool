name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  sim-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run physics and rules tests
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Isrc tests/sim_test.cpp src/sim/Sim.cpp -o sim_test
          ./sim_test
          g++ -std=c++20 -O2 -Wall -Wextra -Isrc tests/rules_test.cpp src/sim/Rules.cpp src/sim/Sim.cpp -o rules_test
          ./rules_test
          g++ -std=c++20 -O2 -Wall -Wextra -Isrc tests/ai_test.cpp src/sim/Ai.cpp src/sim/Rules.cpp src/sim/Sim.cpp -o ai_test
          ./ai_test

  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          actions-cache-folder: .xmake-cache

      - name: Cache xmake packages
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/.xmake/packages
          key: xmake-pkgs-${{ runner.os }}-${{ hashFiles('xmake.lua', 'lib/commonlibf4/xmake.lua', 'lib/commonlibf4/lib/commonlib-shared/xmake.lua') }}
          restore-keys: xmake-pkgs-${{ runner.os }}-

      - name: Configure
        run: xmake f -m releasedbg -y

      - name: Build
        run: xmake build -y fo4pool

      # ---------------- Papyrus (fo4pool.esl's opponent quest scripts) ----------------
      - name: Vanilla script sources
        run: git clone --depth 1 https://github.com/rux616/modding-fo4-scripts-vanilla.git vanilla

      - name: Cache Caprica
        id: caprica-cache
        uses: actions/cache@v4
        with:
          path: caprica-bin
          key: caprica-v0.3.0

      - name: Get Caprica
        if: steps.caprica-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # Caprica has no release binaries: build it (vcpkg pulls boost + fmt); cached afterwards. Same recipe as
          # evodube/MagicSyringesMod
          git clone --depth 1 -b v0.3.0 https://github.com/Orvid/Caprica caprica-src
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          # Caprica pins boost 1.80, which no longer builds with current MSVC; use the runner's vcpkg ports
          $baseline = git -C $env:VCPKG_ROOT rev-parse HEAD
          $manifest = Get-Content caprica-src/vcpkg.json -Raw | ConvertFrom-Json
          $manifest.'builtin-baseline' = $baseline
          # Caprica's custom formatters use pre-fmt-10 parse() rules; patch them to the current rules
          foreach ($f in 'Caprica/common/identifier_ref.h', 'Caprica/papyrus/PapyrusIdentifier.h', 'Caprica/papyrus/PapyrusType.h') {
            $p = "caprica-src/$f"
            $t = Get-Content $p -Raw
            $t = $t.Replace('if (ctx.begin() != ctx.end())', "if (ctx.begin() != ctx.end() && *ctx.begin() != '}')")
            $t = $t.Replace('return ctx.end();', 'return ctx.begin();')
            Set-Content $p $t -NoNewline
          }
          $manifest | ConvertTo-Json -Depth 10 | Set-Content caprica-src/vcpkg.json
          cmake -S caprica-src -B caprica-build -A x64 "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if ($LASTEXITCODE -ne 0) { throw "Caprica configure failed" }
          cmake --build caprica-build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "Caprica build failed" }
          $exe = Get-ChildItem -Recurse caprica-build -Filter Caprica.exe | Select-Object -First 1
          if (-not $exe) { throw "Caprica.exe not built" }
          New-Item -ItemType Directory -Force caprica-bin | Out-Null
          Copy-Item "$($exe.DirectoryName)\*" caprica-bin -Recurse -Force

      - name: Compile scripts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/Scripts, vanilla-base | Out-Null
          # base-game scripts only, leading whitespace trimmed (some vanilla files start with a space)
          Get-ChildItem vanilla/Source -Filter *.psc -File | ForEach-Object {
            $t = (Get-Content $_.FullName -Raw).TrimStart()
            # (ScriptObject.psc starts with a comment: keep any file that declares a script somewhere)
            if ($t -match '(?im)^\s*scriptname\s') { Set-Content (Join-Path vanilla-base $_.Name) $t -NoNewline }
          }
          Copy-Item vanilla/Source/Institute_Papyrus_Flags.flg vanilla-base/
          Remove-Item -Recurse -Force vanilla   # Caprica also scans the flags file's folder
          # from inside papyrus/, so the scripts are top level (from the repo root Caprica puts them in a
          # 'papyrus' namespace: out/Scripts/papyrus/, and the wrong script names)
          Push-Location papyrus
          ../caprica-bin/Caprica.exe -g fallout4 -i "../vanilla-base" -f ../vanilla-base/Institute_Papyrus_Flags.flg -o ../out/Scripts fo4poolOpponentQuest.psc fo4poolOpponentAlias.psc fo4poolWatchersAlias.psc
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "Caprica failed" }
          Get-ChildItem -Recurse out/Scripts
          foreach ($n in 'fo4poolOpponentQuest', 'fo4poolOpponentAlias', 'fo4poolWatchersAlias') { if (-not (Test-Path "out/Scripts/$n.pex")) { throw "$n.pex not at out/Scripts/" } }

      - name: Package
        shell: pwsh
        run: |
          $stage = "stage"
          New-Item -ItemType Directory -Force "$stage" | Out-Null
          Copy-Item -Recurse dist/Data "$stage/Data"
          New-Item -ItemType Directory -Force "$stage/Data/Scripts/Source/User" | Out-Null
          Copy-Item out/Scripts/*.pex "$stage/Data/Scripts/"
          Copy-Item papyrus/*.psc "$stage/Data/Scripts/Source/User/"
          Copy-Item build/out/F4SE/Plugins/fo4pool.dll "$stage/Data/F4SE/Plugins/"
          Copy-Item build/out/F4SE/Plugins/fo4pool.pdb "$stage/Data/F4SE/Plugins/" -ErrorAction SilentlyContinue
          Copy-Item LICENSE "$stage/Data/F4SE/Plugins/fo4pool-LICENSE.txt" -ErrorAction SilentlyContinue
          Get-ChildItem -Recurse $stage | Select-Object FullName

      - uses: actions/upload-artifact@v4
        with:
          name: fo4pool
          path: stage/

      # The latest main build, also as plain files on the 'builds' branch (one commit, replaced each time), so it
      # can be fetched with git as well as downloaded from the run page.
      - name: Publish to the builds branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          Set-Location stage
          git init -q -b builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Build of ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" builds

      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path stage/Data -DestinationPath "fo4pool-${{ github.ref_name }}.zip"

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: fo4pool-${{ github.ref_name }}.zip
          prerelease: ${{ contains(github.ref_name, '-') }}
